  const salvar = () => {
    const n = nome.value.trim();
    let c = cat.value === NOVA ? novaCat.querySelector('input').value.trim() : cat.value;
    if (!n) { erro.textContent = 'Digite o nome do item.'; return; }
    garantirCategoria(c);
    const ex = c ? S.categorias.find((x) => norm(x.nome) === norm(c)) : null;
    if (ex) c = ex.nome;
    const u = unid.value;
    let alvo = item;
    if (alvo) { alvo.nome = n; alvo.categoria = c; alvo.unidade = u; chamar('salvarItem', { id: alvo.id, nome: n, categoria: c, unidade: u }); }
    else {
      alvo = { id: novoTmp(), nome: n, categoria: c, precisa: false, carrinho: false, ultima: '', foto: '', unidade: u };
      S.itens.push(alvo); prepararDados();
      chamarNovo(alvo.id, 'salvarItem', { id: alvo.id, nome: n, categoria: c, unidade: u });
    }
    if (fotoNova !== undefined) { aplicarFoto(alvo.id, fotoNova); chamarFoto(alvo.id, fotoNova); }
    // marcas
    const lista = marcasEd.filter((m) => m.nome.trim()).map((m) => ({ id: m.id || novoTmp(), nome: m.nome.trim(), nivel: m.nivel, foto: m.foto, fotoAtual: m.fotoAtual }));
    const mudouMarcas = JSON.stringify(lista.map((m) => [m.id, m.nome, m.nivel])) !== marcasOrig || lista.some((m) => m.foto !== undefined);
    if (mudouMarcas) {

      const enviados = lista.map((m) => ({ id: m.id, nome: m.nome, nivel: m.nivel }));
      enviar({ aoOk: (ids) => {
        (ids || []).forEach((real, k) => {
          const velho = enviados[k] && enviados[k].id;
          if (velho && real !== velho) trocarId(velho, real);
          if (lista[k] && lista[k].foto !== undefined) chamarFoto(real, lista[k].foto);
        });
        renderTudo(true);
      } }, 'salvarMarcas', alvo.id, enviados);
    }
    prepararDados(); fecharModal(); renderTudo(false);
  };

  abrirModal(h('div', null,
    h('h2', { class: 'mod', text: item ? 'Editar item' : 'Novo item' }),
    campo('Nome', nome),
    h('div', { class: 'campo' }, h('label', { class: 'rot', text: 'Categoria' }), cat, novaCat),
    h('div', { class: 'campo' }, h('label', { class: 'rot', text: 'Como costuma comprar' }), unid),
    h('div', { class: 'campo' }, h('label', { class: 'rot', text: 'Foto do item' }),
      h('div', { class: 'foto-linha' }, prev, h('div', { class: 'col' },
        h('button', { type: 'button', class: 'btn sec peq', onclick: selFoto.abrir }, ic('subir', 16), 'Escolher foto'),
        h('button', { type: 'button', class: 'btn sec peq', onclick: () => { fotoNova = ''; pintarFoto(); } }, ic('lixo', 16), 'Remover'))),
      selFoto.input, selFoto.erro),
    h('h3', { class: 'sec', text: 'Marcas' }),
    marcasBox,
    h('button', { type: 'button', class: 'btn sec', onclick: () => { marcasEd.push({ id: '', nome: '', nivel: 'preferida', foto: undefined }); pintarMarcas(); const ins = marcasBox.querySelectorAll('input[type=text]'); ins[ins.length - 1].focus(); } }, ic('mais', 18), 'Marca'),
    erro,
    h('div', { class: 'acoes' },
      h('button', { class: 'btn grande', onclick: salvar }, ic('ok', 20), 'Salvar'),
      item ? botaoConfirma('Excluir item', 'Toque de novo para excluir', () => {
        S.itens = S.itens.filter((i) => i.id !== item.id);
        S.marcas = S.marcas.filter((m) => m.item !== item.id);
        prepararDados(); fecharModal(); renderTudo(false); chamar('excluirItem', item.id);
      }) : null)));
}

        h('button', { type: 'button', class: 'btn sec peq', onclick: () => { fotoNova = ''; pintarFoto(); } }, ic('lixo', 16), 'Remover'))),

    campo('Senha', comOlho(senha)),
    campo('Permissão', perm),
    !u ? h('div', { class: 'ajuda' }, ic('info', 18), 'A pessoa entra no app com esse e-mail e essa senha. Combine a senha com ela.') : null,
    erro,
    h('div', { class: 'acoes' },
      h('button', { class: 'btn grande', text: 'Salvar', onclick: () => {

        const reg = { id: uid, email: e, nome: n, papel, foto: u ? u.foto : '' };
        const i = S.usuarios.findIndex((x) => x.email === e);
        if (i >= 0) S.usuarios[i] = reg; else S.usuarios.push(reg);
        if (e === S.eu.email) { S.eu.nome = n; if (!S.eu.id) S.eu.id = uid; }
        if (fotoNova !== undefined) aplicarFoto(uid, fotoNova);
        fecharModal(); renderTudo(false);
        chamarNovo(uid, 'salvarUsuario', e, n, papel, sn);
        if (fotoNova !== undefined) chamarFoto(uid, fotoNova);
      } }),
      u && !eu ? botaoConfirma('Remover pessoa', 'Toque de novo para remover', () => {
        S.usuarios = S.usuarios.filter((x) => x.email !== u.email);
        fecharModal(); renderTudo(false); chamar('excluirUsuario', u.email);
      }) : null)));
}

{ const si = $('entrarSenha'); const ph = document.createComment(''); si.before(ph); ph.replaceWith(comOlho(si)); }
if (lerSessao()) carregarTudo(false); else mostrarLogin();
setInterval(() => {
  if (document.hidden || !pronto) return;
  const intervalo = S.sessao.ativa ? 10000 : 30000;
  if (Date.now() - ultimoPoll >= intervalo) carregarTudo(false);
}, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && pronto) carregarTudo(false); });
// ----- convite para instalar o app -----
let eventoInstalar = null;
const jaInstalado = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalarAdiado = () => { try { return Date.now() < Number(localStorage.getItem('am_inst_nao') || 0); } catch (e) { return false; } };
function mostrarInstalar() {
  if (jaInstalado() || instalarAdiado() || (!eventoInstalar && !ehIOS)) return;
  $('instDica').textContent = eventoInstalar ? 'Abra mais rápido, direto da tela inicial.'
    : 'Toque em Compartilhar e depois em "Adicionar à Tela de Início".';
  $('instOk').hidden = !eventoInstalar;
  $('instalar').hidden = false;
}
$('instNao').replaceChildren(ic('x', 18));
window.addEventListener('beforeinstallprompt', (ev) => { ev.preventDefault(); eventoInstalar = ev; if (pronto) mostrarInstalar(); });
window.addEventListener('appinstalled', () => { eventoInstalar = null; $('instalar').hidden = true; });
$('instOk').onclick = async () => {
  if (!eventoInstalar) return;
  const ev = eventoInstalar; eventoInstalar = null; $('instalar').hidden = true;
  try { await ev.prompt(); await ev.userChoice; } catch (e) { /* o navegador recusou */ }
};
$('instNao').onclick = () => {
  $('instalar').hidden = true;
  try { localStorage.setItem('am_inst_nao', String(Date.now() + 14 * 86400000)); } catch (e) { /* sem armazenamento */ }
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
